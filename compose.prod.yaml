services:
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: production
    ports:
      - 9000:80
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - anthropic-api-key
      - db-password-prod
    environment:
      - DATABASE_URL=mysql://root:${DB_PASSWORD_PROD}@db:3306/photo-gallery?serverVersion=mariadb-10.5.8
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-haiku-4-5-20251001
#    environment:
#      - PASSWORD_FILE_PATH=/run/secrets/db-password-prod
#      - DB_HOST=db
#      - DB_NAME=photo-gallery
#      - DB_USER=root
#      - DB_PASSWORD_PROD_FILE=/run/secrets/db-password-prod

  db:
    volumes:
      - db-data-prod:/var/lib/mysql
    secrets:
      - db-password-prod
    environment:
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db-password-prod
      - MARIADB_DATABASE=photo-gallery
    ports: []

volumes:
  db-data-prod:

secrets:
  db-password-prod:
    environment: "DB_PASSWORD_PROD"
  anthropic-api-key:
    environment: "ANTHROPIC_API_KEY"
