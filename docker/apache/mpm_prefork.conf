# Replaces Debian's /etc/apache2/mods-available/mpm_prefork.conf.
# MaxRequestWorkers is a memory ceiling, not a speed setting: it must be what fits in RAM.
# CX22 (4 GB): ~2.5 GB left for Apache after OS, MariaDB, Nginx and Caddy; ~50 MB per process → ~50. 40 leaves margin.
# See docs/features/Photograph_Download.md, section "Apache".
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers       40
    MaxConnectionsPerChild   0
</IfModule>
