# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    public_images_dir: '%kernel.project_dir%/%env(UPLOAD_DIR)%'
    images_dir: '/images'
    fixtures_images_dir: '%kernel.project_dir%/fixtures/images/'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $imagesDir: '%images_dir%'
            $publicImageDir: '%public_images_dir%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Application/Commands/*'
            - '../src/Application/Query/*'
            - '../src/Application/ValueObject/*'
            - '../src/Domain/Entity/*'
            - '../src/Domain/ValueObject/*'
            - '../src/Infrastructure/Symfony/Security/User/*'
            - '../src/Presentation/Attribute/*'
            - '../src/Presentation/DTO/Photograph/*'

    App\Presentation\Action\:
        resource: '../src/Presentation/Action/*'
        tags: [ 'controller.service_arguments' ]

    App\Application\Handler\:
        resource: '../src/Application/Handler/*'
        tags: [ 'messenger.message_handler' ]

    App\Infrastructure\Symfony\Event\ExceptionEventListener:
        tags: [ 'kernel.event_listener' ]

    App\Infrastructure\Symfony\Event\DownloadSlotEventListener:
        tags:
            - { name: 'kernel.event_listener', event: !php/const App\Infrastructure\Symfony\Event\DownloadSlotEventListener::REQUIRES_DOWNLOAD_SLOT_EVENT, method: 'claimSlot' }
            - { name: 'kernel.event_listener', event: !php/const Symfony\Component\HttpKernel\KernelEvents::TERMINATE, method: 'releaseSlot' }

    app.image_description_generator.anthropic:
        class: App\Infrastructure\Symfony\Ai\ImageDescriptionGenerator
        arguments:
            $platform: '@ai.platform.anthropic'
            $model: '%env(ANTHROPIC_MODEL)%'
            $options: { max_tokens: 150 }
            $maxImageBytes: 10485760   # Anthropic's documented limit, base64-encoded (https://platform.claude.com/docs/en/build-with-claude/vision#image-limits-and-costs)

    app.image_description_generator.ollama:
        class: App\Infrastructure\Symfony\Ai\ImageDescriptionGenerator
        arguments:
            $platform: '@ai.platform.ollama'
            $model: '%env(OLLAMA_MODEL)%'
            $options: { num_predict: 150 }

    app.image_description_generator.fake:
        class: App\Infrastructure\ImageDescription\FakeImageDescription\FakeImageDescriptionGenerator

    app.image_description_generator_locator:
        class: Symfony\Component\DependencyInjection\ServiceLocator
        arguments:
            -
                anthropic: '@app.image_description_generator.anthropic'
                ollama: '@app.image_description_generator.ollama'
                fake: '@app.image_description_generator.fake'

    App\Domain\Service\ImageDescriptionGeneratorInterface:
        factory: [ '@App\Infrastructure\ImageDescription\Factory\ImageDescriptionGeneratorFactory', 'create' ]

    App\Infrastructure\ImageDescription\Factory\ImageDescriptionGeneratorFactory:
        arguments:
            $serviceProvider: '@app.image_description_generator_locator'
            $provider: '%env(enum:App\Infrastructure\ImageDescription\Enum\ImageDescriptionProvider:IMAGE_DESCRIPTION_PROVIDER)%'

when@dev:

    services:

        _defaults:
            autowire: true
            autoconfigure: true
            bind:
                $projectDir: '%kernel.project_dir%'
                $publicImageDir: '%public_images_dir%'

        App\Fixtures\:
            resource: '../fixtures/*'

when@prod:

    services:

        _defaults:
            autowire: true
            autoconfigure: true
            bind:
                $publicImageDir: '%public_images_dir%'

