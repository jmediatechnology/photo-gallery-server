App\Application\Commands\Photograph\CreateCommand:
    constraints:
        - App\Infrastructure\Symfony\Validator\Photograph\CreateCommandConstraint:
            message: 'Title is already in use.'
    properties:
        title:
            - NotBlank: ~
        file:
            - File:
                mimeTypes: [ 'image/jpeg', 'image/png', 'image/webp' ]
                mimeTypesMessage: 'Upload a JPEG, PNG or WebP image'

App\Application\Commands\Photograph\UpdateCommand:
    constraints:
        - App\Infrastructure\Symfony\Validator\Photograph\UpdateCommandConstraint:
              message: 'Title is already in use.'
    properties:
        title:
            - NotBlank: ~

App\Application\Query\Photograph\GenerateDescriptionForKnownPhotographUuidQuery:
    constraints:
        - App\Infrastructure\Symfony\Validator\Photograph\GenerateDescriptionForKnownPhotographUuidConstraint:
            message: 'Uuid is not known.'
    properties:
        uuid:
            - NotBlank: ~

App\Application\Query\Photograph\DownloadQuery:
    # Checks the shape of the selection first; looks the photographs up only when the shape is valid.
    group_sequence:
        - DownloadQuery
        - KnownPhotographs
    constraints:
        - App\Infrastructure\Symfony\Validator\Photograph\DownloadForKnownPhotographUuidsConstraint:
              message: 'Photographs not found: {{ uuids }}'
              groups: [KnownPhotographs]
    properties:
        uuids:
            - Count:
                  min: 1
                  max: !php/const App\Application\Query\Photograph\DownloadQuery::MAX_PHOTOGRAPHS
                  minMessage: 'Select at least one photograph to download'
                  maxMessage: 'Select at most {{ limit }} photographs to download'
            - All:
                  - Uuid:
                        message: '{{ value }} is not a valid photograph id'
