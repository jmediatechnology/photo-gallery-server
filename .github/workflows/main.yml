name: Server CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PHP_VERSION: "8.5"
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    validate:
        name: Validate Composer Config
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none

            - name: Validate composer.json/composer.lock
              run: composer validate --strict --no-check-publish

    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: [validate]
        env:
            APP_ENV: test
            JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE_TEST }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ctype, iconv, simplexml, fileinfo, libxml, mbstring, pdo_sqlite, sqlite3, zip
                  coverage: xdebug
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Generate JWT keypair
              run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

            - name: Run PHPUnit
              env:
                  RUN_EXPENSIVE_API_TESTS: "false"
              run: |
                  mkdir -p var/reports/coverage
                  ./vendor/bin/phpunit tests --coverage-clover=var/reports/coverage/clover.xml

            - name: Enforce coverage threshold
              env:
                  MIN_COVERAGE: "100"
              run: |
                  COVERAGE=$(php bin/coverage-percentage.php ./var/reports/coverage/clover.xml | tail -n1 | tr -d '[:space:]%')
                  echo "Coverage: ${COVERAGE}%"
                  if [ -z "$COVERAGE" ]; then
                    echo "::error::Could not parse a coverage percentage from the script output."
                    exit 1
                  fi
                  if awk "BEGIN { exit !($COVERAGE < $MIN_COVERAGE) }"; then
                    echo "::error::Coverage ${COVERAGE}% is below the required ${MIN_COVERAGE}%."
                    exit 1
                  fi
                  echo "Coverage ${COVERAGE}% meets the ${MIN_COVERAGE}% threshold."

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage-report
                  path: var/reports/coverage/clover.xml
                  retention-days: 7

